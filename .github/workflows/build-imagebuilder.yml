name: Build iStoreOS ImageBuilder

on:
  workflow_dispatch:
    inputs:
      target_subtarget:
        description: 'Target Subtarget (e.g., 64, armv8, rk35xx, filogic)'
        required: true
        default: '64'
      custom_repo_url:
        description: 'Custom Package Repository URL (Optional)'
        required: false
        default: ''

jobs:
  build-imagebuilder:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: istoreos-25.12  # 指定你的目标分支

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext libncurses5-dev libssl-dev \
          python3-distutils python3-setuptools rsync unzip zlib1g-dev \
          file wget qemu-utils

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Configuration
        run: |
          # 清理旧配置
          rm -f .config
          
          # 设置目标架构
          echo "CONFIG_TARGET_${{ github.event.inputs.target_system }}=y" >> .config
          echo "CONFIG_TARGET_${{ github.event.inputs.target_system }}_${{ github.event.inputs.target_subtarget }}=y" >> .config
          
          # 开启 ImageBuilder 构建选项 (通常默认开启，但显式声明更安全)
          echo "CONFIG_IB=y" >> .config
          echo "CONFIG_IB_STANDALONE=y" >> .config
          
          # 【专用定制点 1】：如果你想让 ImageBuilder 默认包含某些特定软件包
          # 取消下面的注释并修改包名，这些包会被预编译并打包进 ImageBuilder 的 packages/ 目录
          # echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
          # echo "CONFIG_PACKAGE_docker=y" >> .config
          # echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config

          # 应用默认配置
          make defconfig

      - name: Inject Custom Repository (Optional)
        if: github.event.inputs.custom_repo_url != ''
        run: |
          # 【专用定制点 2】：注入自定义软件源到 ImageBuilder 的默认配置中
          # 这样生成的 ImageBuilder 在使用时，会默认拉取你的自建源
          echo "src/custom ${{ github.event.inputs.custom_repo_url }}" >> repositories.conf
          # 同时确保 .config 中也启用了该源（如果 feeds 中定义了的话）

      - name: Download Packages
        run: make download -j$(nproc)

      - name: Compile ImageBuilder
        run: |
          # 使用 -j 参数并行编译，V=s 输出详细日志以便排错
          make imagebuilder V=s -j$(nproc)

      - name: Find and Upload Artifacts
        run: |
          # 查找生成的 ImageBuilder 文件
          IB_FILE=$(find bin/targets/ -name "iStoreOS-imagebuilder-*.tar.xz" | head -n 1)
          if [ -z "$IB_FILE" ]; then
            echo "Error: ImageBuilder file not found!"
            exit 1
          fi
          echo "IB_FILE=$IB_FILE" >> $GITHUB_ENV
          echo "Found ImageBuilder: $IB_FILE"

      - name: Upload ImageBuilder Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-ImageBuilder-${{ github.event.inputs.target_system }}-${{ github.event.inputs.target_subtarget }}
          path: ${{ env.IB_FILE }}
          retention-days: 7
