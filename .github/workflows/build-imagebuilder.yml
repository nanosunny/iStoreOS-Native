name: Build Firmware With ImageBuilder

# ============================================================================
# 工作流二：用 ImageBuilder 打包 panther-x2 / g68-plus 固件
#
# 前置：必须先跑过「Make iStoreOS ImageBuilder」（工作流一），
#       并在其中开启了「注入设备」，否则本工作流的 PROFILE 不存在。
#
# 产物：两个设备的 squashfs-sysupgrade 固件
#   iStoreOS-<版本>-rockchip-armv8-panther-x2-squashfs-sysupgrade.img.gz
#   iStoreOS-<版本>-rockchip-armv8-g68-plus-squashfs-sysupgrade.img.gz
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      ib_source:
        description: 'ImageBuilder 来源'
        required: true
        default: 'artifact'
        type: choice
        options:
          - 'artifact'          # 使用工作流一上传的 Artifact
          - 'url'               # 使用直链下载（Release / 镜像站）
          - 'docker'            # 使用本仓库 Workflow 内构建（不推荐，改用工作流一）
      ib_url:
        description: 'ib_source=url 时填写 IB 直链'
        required: false
        default: ''
        type: string
      profiles:
        description: '要打包的设备（逗号分隔）'
        required: true
        default: 'panther-x2,g68-plus'
        type: string
      extra_packages:
        description: '追加/剔除软件包（空格分隔，前缀 - 表示剔除）'
        required: false
        default: ''
        type: string
      rootfs_partsize:
        description: 'ROOTFS_PARTSIZE（MB，留空用默认）'
        required: false
        default: ''
        type: string
      upload_artifact:
        description: '上传固件为 Artifact'
        required: true
        default: true
        type: boolean
      upload_release:
        description: '发布固件到 Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  build-firmware:
    name: Build firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential gawk gettext libncurses5-dev zlib1g-dev \
            libssl-dev python3 python3-distutils rsync unzip file wget curl \
            zstd gzip xz-utils libelf-dev

      - name: 准备 ImageBuilder（Artifact 来源）
        if: ${{ inputs.ib_source == 'artifact' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: make-imagebuilder.yml
          name: iStoreOS-ImageBuilder-rockchip-armv8
          path: ib
          search_artifacts: true
          if_no_artifact_found: fail

      - name: 准备 ImageBuilder（直链来源）
        if: ${{ inputs.ib_source == 'url' }}
        run: |
          mkdir -p ib
          if [ -z "${{ inputs.ib_url }}" ]; then
            echo "::error::ib_source=url 但未填写 ib_url"; exit 1
          fi
          wget -q --show-progress -O ib/ib.tar "${{ inputs.ib_url }}"
          case "${{ inputs.ib_url }}" in
            *.zst) zstd -d -f ib/ib.tar ;;
            *.xz)  xz -d -f ib/ib.tar 2>/dev/null || true ;;
          esac

      - name: 解压 ImageBuilder
        id: unpack
        run: |
          cd ib
          ARCHIVE=$(find . -maxdepth 2 -type f \( -name '*.tar.zst' -o -name '*.tar.xz' -o -name 'ib.tar' \) | head -n1)
          [ -z "$ARCHIVE" ] && { echo "::error::ib 目录下未找到 IB 压缩包"; ls -R .; exit 1; }
          echo "解压：$ARCHIVE"
          case "$ARCHIVE" in
            *.tar.zst) tar --zstd -xf "$ARCHIVE" ;;
            *)         tar -xf "$ARCHIVE" ;;
          esac
          IBDIR=$(find . -maxdepth 1 -type d -name '*imagebuilder*' | head -n1)
          [ -z "$IBDIR" ] && IBDIR="."
          echo "ibdir=$PWD/$IBDIR" >> "$GITHUB_OUTPUT"
          echo "IB 目录：$PWD/$IBDIR"
          ls -la "$IBDIR" | head -30

      - name: 校验设备 profile 是否可用
        run: |
          cd "${{ steps.unpack.outputs.ibdir }}"
          echo "===== 可用 Profile（截取关键部分）====="
          make info 2>/dev/null | grep -iE 'panther|g68|rk356' || true
          for p in $(echo "${{ inputs.profiles }}" | tr ',' ' '); do
            if make info 2>/dev/null | grep -qi "$p"; then
              echo "::notice::Profile 可用：$p"
            else
              echo "::error::Profile 不存在：$p。说明该 IB 未注入此设备，请重跑工作流一并开启「注入设备」。"
              exit 1
            fi
          done

      - name: 更换 IB 软件源为国内镜像
        if: ${{ contains(fromJSON('["artifact","url"]'), inputs.ib_source) }}
        run: |
          cd "${{ steps.unpack.outputs.ibdir }}"
          if [ -f repositories.conf ]; then
            sed -i 's#https\?://downloads.openwrt.org#https://mirrors.tuna.tsinghua.edu.cn/openwrt#g' repositories.conf
            echo "repositories.conf 已替换为清华源"
            grep -E '^(src|# src)' repositories.conf | head -10
          fi
          if [ -f keys/*.pub ]; then echo "已内置签名密钥：$(ls keys | tr '\n' ' ')"; fi

      - name: 逐设备打包固件
        id: build
        run: |
          cd "${{ steps.unpack.outputs.ibdir }}"
          mkdir -p "$GITHUB_WORKSPACE/out"
          EXTRA="${{ inputs.extra_packages }}"
          PART=""
          if [ -n "${{ inputs.rootfs_partsize }}" ]; then
            PART="ROOTFS_PARTSIZE=${{ inputs.rootfs_partsize }}"
          fi
          FAILED=""
          for p in $(echo "${{ inputs.profiles }}" | tr ',' ' '); do
            echo "==================== 打包 $p ===================="
            rm -rf bin/targets 2>/dev/null || true
            # make image 会先 update 源，-j 加速；失败则加 V=s 重试一次
            if ! make image PROFILE="$p" PACKAGES="$EXTRA" FILES="files/" $PART -j$(nproc); then
              echo "::warning::$p 首次打包失败，单线程 V=s 重试"
              if ! make image PROFILE="$p" PACKAGES="$EXTRA" FILES="files/" $PART V=s; then
                echo "::error::$p 打包失败"
                FAILED="$FAILED $p"
                continue
              fi
            fi
            # 只收 sysupgrade 固件，跳过镜像/其他中间产物
            find bin/targets -type f \( -name '*sysupgrade*.img.gz' -o -name '*sysupgrade*.img' \) -print0 \
              | xargs -0 -I{} cp -v {} "$GITHUB_WORKSPACE/out/" || true
          done
          echo "===== 本次收集到的固件 ====="
          ls -lh "$GITHUB_WORKSPACE/out/" || true
          if [ ! -z "$FAILED" ]; then
            echo "::error::以下设备打包失败：$FAILED"; exit 1
          fi

      - name: 生成固件校验信息（SHA256）
        run: |
          cd "$GITHUB_WORKSPACE/out"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 写入构建摘要
        run: |
          {
            echo "## 固件打包完成"
            echo ""
            echo "- ImageBuilder 来源：\`${{ inputs.ib_source }}\`"
            echo "- 打包设备：\`${{ inputs.profiles }}\`"
            echo "- 追加软件包：\`${{ inputs.extra_packages }}\`"
            echo ""
            echo "### 产物"
            echo '```'
            ls -lh "$GITHUB_WORKSPACE/out" | awk 'NR>1{print $5, $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传固件为 Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-firmware-rockchip-armv8
          path: out/*
          compression-level: 0
          retention-days: 30

      - name: 发布固件到 Release（可选）
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-${{ github.run_number }}
          name: iStoreOS firmware rockchip-armv8 (build ${{ github.run_number }})
          files: out/*
          draft: false
          prerelease: true
