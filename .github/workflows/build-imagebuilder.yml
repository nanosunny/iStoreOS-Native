name: Build Firmware With ImageBuilder

# 用上一步 Make iStoreOS ImageBuilder 产出的定制 IB（或任意 Release 上的 IB），
# 快速打包 panther-panther-x2 / nsy-g68-plus 两个设备的 sysupgrade 固件。
# 纯 IB 打包，分钟级完成，不编内核、不跑 feeds。

on:
  workflow_dispatch:
    inputs:
      ib_source:
        description: IB 来源（workflow=本仓库 workflow artifact，release=指定 release tag，url=直链）
        required: true
        default: workflow
        type: choice
        options:
          - workflow
          - release
          - url
      ib_release_tag:
        description: 当 ib_source=release 时使用的 Release tag
        required: false
        default: "imagebuilder-latest"
        type: string
      ib_url:
        description: 当 ib_source=url 时的 IB tar.zst 直链
        required: false
        default: ""
        type: string
      profiles:
        description: 要打包的设备 PROFILE（留空则自动探测两设备）
        required: false
        default: ""
        type: string
      extra_packages:
        description: 额外预置包（空格分隔）
        required: false
        default: "luci-app-store luci-i18n-store-zh-cn"
        type: string
      files_dir:
        description: 额外 overlay 文件（仓库内相对路径，默认无）
        required: false
        default: ""
        type: string
      release_tag:
        description: 固件发布 Release 的标签（留空则只上 Artifact）
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-fw:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:

      - name: Checkout 本仓库（如需额外 files 目录）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: selfrepo

      - name: 准备工作目录
        run: |
          mkdir -p /work/ib /work/out /work/dl

      - name: 获取 IB（来自上一条工作流的 Artifact）
        if: ${{ github.event.inputs.ib_source == 'workflow' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: iStoreOS-ImageBuilder-rockchip-armv8
          workflow: make-imagebuilder.yml
          search_artifacts: true
          path: /work/dl
          name_is_regexp: true

      - name: 获取 IB（来自本仓库 Release）
        if: ${{ github.event.inputs.ib_source == 'release' }}
        run: |
          set -e
          TAG="${{ github.event.inputs.ib_release_tag }}"
          echo "从 Release 获取 IB：tag=$TAG"
          URL=$(curl -fsL \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | jq -r '.assets[] | select(.name|endswith(".tar.zst") and contains("imagebuilder")) | .browser_download_url' | head -1)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Release $TAG 未找到 IB 压缩包"
            exit 1
          fi
          echo "下载：$URL"
          curl -fL --connect-timeout 20 --max-time 240 -o /work/dl/ib.tar.zst "$URL"

      - name: 获取 IB（来自 URL 直链）
        if: ${{ github.event.inputs.ib_source == 'url' }}
        run: |
          set -e
          URL="${{ github.event.inputs.ib_url }}"
          if [ -z "$URL" ]; then
            echo "::error::ib_source=url 时 ib_url 不能为空"
            exit 1
          fi
          curl -fL --connect-timeout 20 --max-time 240 -o /work/dl/ib.tar.zst "$URL"

      - name: 解压 IB
        run: |
          set -e
          cd /work/dl
          echo "=== 文件清单 ==="
          ls -lh
          IB_TAR=$(ls *.tar.zst 2>/dev/null | head -1)
          if [ -z "$IB_TAR" ]; then
            echo "::error::未找到 IB 压缩包（.tar.zst）"
            exit 1
          fi
          tar -xf "$IB_TAR" -C /work/ib --strip-components=1
          rm -rf /work/dl
          echo "=== IB 根目录 ==="
          ls /work/ib/

      - name: 安装 IB 运行依赖
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential gawk unzip libncurses-dev zlib1g-dev python3 \
            file wget xsltproc git ca-certificates python3-pyelftools \
            >/dev/null 2>&1 || true

      - name: 确认 profiles 列表（自检）
        working-directory: /work/ib
        id: profiles
        run: |
          set -e
          rm -rf tmp 2>/dev/null || true
          echo "=== make info 可用 PROFILE ==="
          PROFILES_ALL=$(make info 2>&1 | awk '/^[a-zA-Z0-9_-]+:/{print $1}' | tr -d ':')
          echo "$PROFILES_ALL" | grep -E "panther|g68|firefly|nanopi" | head -30 || true
          USER_PROFILES="${{ github.event.inputs.profiles }}"
          if [ -n "$USER_PROFILES" ]; then
            TARGETS="$USER_PROFILES"
          else
            TARGETS=""
            for p in panther-panther-x2 nsy-g68-plus; do
              if echo "$PROFILES_ALL" | grep -qx "$p"; then
                TARGETS="$TARGETS $p"
              else
                echo "::warning::$p 在 IB 中不可见（将跳过；请确认 IB 是已注入设备的版本）"
              fi
            done
            TARGETS=$(echo "$TARGETS" | xargs)
          fi
          if [ -z "$TARGETS" ]; then
            echo "::error::没有可打包的 profile，请检查 IB 是否注入了设备"
            exit 1
          fi
          echo "TARGETS=$TARGETS"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: 给两设备打包固件
        working-directory: /work/ib
        run: |
          set +e
          EXTRA="${{ github.event.inputs.extra_packages }}"
          FILES_ARG=""
          if [ -n "${{ github.event.inputs.files_dir }}" ]; then
            FD="$GITHUB_WORKSPACE/selfrepo/${{ github.event.inputs.files_dir }}"
            if [ -d "$FD" ]; then
              FILES_ARG="FILES=$FD"
              echo "额外 overlay：$FD"
            else
              echo "::warning::files_dir 不存在：$FD，忽略"
            fi
          fi
          mkdir -p /work/out
          for P in ${{ steps.profiles.outputs.targets }}; do
            echo ""
            echo "============================"
            echo " 打包 PROFILE：$P"
            echo "============================"
            make image PROFILE="$P" PACKAGES="$EXTRA" $FILES_ARG V=s
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error::$P 打包失败（rc=$rc）"
              exit 1
            fi
          done
          echo ""
          echo "=== 全部打包完成，收集固件 ==="
          find bin/targets -maxdepth 4 -type f \( -name "*sysupgrade*.img.gz" -o -name "*sysupgrade*.bin" \) -newer /etc/hostname -exec ls -lh {} \;

      - name: 收集固件并生成校验
        working-directory: /work/ib
        run: |
          set -e
          cd bin/targets/*/*
          echo "=== 目标目录 ==="
          pwd
          ls -lh
          # 只收 sysupgrade 与对应 sha256sums
          mkdir -p /work/out/firmware
          find . -maxdepth 1 -type f \( -name "*sysupgrade*" -o -name "sha256sums" -o -name "*.manifest" \) \
            -exec cp -v {} /work/out/firmware/ \;
          cd /work/out/firmware
          # 生成总 SHA256SUMS
          sha256sum *.img.gz *.bin 2>/dev/null > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: 上传固件为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-firmware-rockchip-armv8
          path: /work/out/firmware/*
          retention-days: 60
          compression-level: 6

      - name: 发布固件到 Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "iStoreOS Firmware - panther-x2 / G68-PLUS"
          prerelease: false
          files: /work/out/firmware/*
          body: |
            ## 固件说明
            - 基于 OpenWrt ImageBuilder（已注入 panther-panther-x2、nsy-g68-plus）
            - 插件源：iStoreOS 官方 apk 源，预装 luci-app-store
            - 包含：两个设备的 sysupgrade 镜像 + 清单 + SHA256SUMS

            **刷机前请核对 sha256。**
