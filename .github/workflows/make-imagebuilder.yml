name: Make iStoreOS ImageBuilder

# ============================================================================
# 工作流一：制作 ImageBuilder（IB）
#
# 关键前提（必读）：
#   panther-x2 / g68-plus 不是 iStoreOS 官方目标自带的设备，它们的 Device 定义、
#   DTS、无线与交换芯片补丁，都是由本仓库 scripts/02_add_device.sh 注入上游源码的。
#   ImageBuilder 是「源码编译后的产物」，只认编译时存在的 profile。
#   因此要做出「能打出 panther-x2 / g68-plus 固件」的 IB，
#   必须在【注入设备之后】的源码上编译并打包 IB。
#   否则工作流二里 make image PROFILE=panther-x2 会报 Unknown profile。
#
# 产出：iStoreOS-imagebuilder-rockchip-armv8.Linux-x86_64.tar.zst
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'iStoreOS 上游源码仓库'
        required: true
        default: 'https://github.com/istoreos/istoreos.git'
        type: string
      source_branch:
        description: '上游源码分支（要编译的目标分支）'
        required: true
        default: 'istoreos-25.12'
        type: string
      add_devices:
        description: '是否注入 panther-x2 / g68-plus 设备与补丁'
        required: true
        default: true
        type: boolean
      ib_standalone:
        description: 'IB 是否自带全部软件包（STANDALONE）：独立可用但体积大、更慢'
        required: true
        default: false
        type: boolean
      build_threads:
        description: '编译线程数（0 = 自动取 CPU 核数一半）'
        required: true
        default: '0'
        type: string
      upload_release:
        description: '是否把 IB 发布到 Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: make-ib-${{ github.ref }}
  cancel-in-progress: false

jobs:
  make-ib:
    name: Build ImageBuilder (rockchip/armv8)
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: 检出本仓库（获取设备注入脚本）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses5-dev libncursesw5-dev zlib1g-dev libssl-dev \
            python3 python3-distutils python3-setuptools python3-pip \
            rsync unzip file wget curl time swig subversion \
            zstd gzip xz-utils ecj fastjar jq libelf-dev libgnutls28-dev

      - name: 配置编译线程数
        id: threads
        run: |
          if [ "${{ inputs.build_threads }}" = "0" ] || [ -z "${{ inputs.build_threads }}" ]; then
            N=$(( $(nproc) / 2 )); [ "$N" -lt 2 ] && N=2
            echo "j=$N" >> "$GITHUB_OUTPUT"
          else
            echo "j=${{ inputs.build_threads }}" >> "$GITHUB_OUTPUT"
          fi
          echo "使用线程数: $(grep '^j=' $GITHUB_OUTPUT | cut -d= -f2)"

      - name: 克隆上游源码
        run: |
          git clone --depth 1 \
            --branch "${{ inputs.source_branch }}" \
            "${{ inputs.source_repo }}" istoreos
          cd istoreos
          git log -1 --pretty=format:'%H %ad %s' > /tmp/src-rev.txt
          grep -qi istoreos .config VERSION 2>/dev/null || true
          echo "源码版本：$(cat /tmp/src-rev.txt)"

      - name: 注入设备（panther-x2 / g68-plus）
        if: ${{ inputs.add_devices }}
        run: |
          cd istoreos
          # 仓库脚本可能叫 scripts/02_add_device.sh 或位于根目录，两种都兜住
          SCRIPT=$(find . -maxdepth 2 -name '02_add_device.sh' | head -n1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::未找到 02_add_device.sh，无法注入设备。请确认 source_branch 是否为带该脚本的分支。"
            exit 1
          fi
          echo "使用注入脚本：$SCRIPT"
          bash "$SCRIPT"
          # 校验：设备是否真的进入目标设备表
          for dev in panther-x2 g68-plus; do
            if grep -rq "$dev" target/linux/rockchip/image/ 2>/dev/null; then
              echo "::notice::设备 $dev 已注入 target/linux/rockchip/image/"
            else
              echo "::warning::在 target/linux/rockchip/image/ 未找到 $dev，请检查注入脚本输出"
            fi
          done

      - name: 更换为国内下载源（加速）
        run: |
          cd istoreos
          # feeds 源与下载源镜像到清华，显著减少拉取超时与重试
          if [ -f feeds.conf.default ]; then
            sed -i 's#git://git.openwrt.org/feed/#https://mirrors.tuna.tsinghua.edu.cn/openwrt/feed/#g' feeds.conf.default
            sed -i 's#https://git.openwrt.org/feed/#https://mirrors.tuna.tsinghua.edu.cn/openwrt/feed/#g' feeds.conf.default
            sed -i 's#https://github.com/openwrt/#https://mirrors.tuna.tsinghua.edu.cn/openwrt/#g' feeds.conf.default
          fi
          mkdir -p files
          echo "下载源替换完成"

      - name: 更新并安装 feeds
        run: |
          cd istoreos
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 IB 编译配置
        run: |
          cd istoreos
          # 直接写入 .config：只编 rockchip/armv8 目标 + 打开 IB
          if [ "${{ inputs.ib_standalone }}" = "true" ]; then IB_STD=y; else IB_STD=n; fi
          {
            echo 'CONFIG_TARGET_rockchip=y'
            echo 'CONFIG_TARGET_rockchip_armv8=y'
            echo 'CONFIG_TARGET_MULTI_PROFILE=y'
            echo 'CONFIG_TARGET_ALL_PROFILES=y'
            echo 'CONFIG_IB=y'
            echo "CONFIG_IB_STANDALONE=$IB_STD"
            echo 'CONFIG_ALL_KMODS=n'
            echo 'CONFIG_ALL=n'
          } > .config
          # 用 defconfig 归一化，并对新出现的选项一律取默认值
          make defconfig
          echo "===== 生效的关键配置 ====="
          grep -E '^CONFIG_(TARGET_rockchip|TARGET_rockchip_armv8|IB|IB_STANDALONE|ALL_KMODS)' .config || true

      - name: 下载源码包（并发）
        run: |
          cd istoreos
          make download -j8
          # 补一次单线程 download，修复个别未下全的包（失败不致命）
          make download -j1 V=s || true

      - name: 编译工具链与目标（含注入设备的内核）
        run: |
          cd istoreos
          J=${{ steps.threads.outputs.j }}
          echo "并行度 J=$J"
          if ! make tools/install toolchain/install target/linux/install -j"$J"; then
            echo "::warning::并行编译失败，回退单线程重试以暴露真实错误"
            make tools/install toolchain/install target/linux/install -j1 V=s
          fi

      - name: 打包 ImageBuilder
        run: |
          cd istoreos
          make target/imagebuilder/compile -j1 V=s 2>&1 | tee /tmp/ib-build.log
          echo "===== 定位 IB 产物 ====="
          find bin/targets -name '*imagebuilder*' -o -name '*ImageBuilder*' | sort

      - name: 收集并规整 IB 产物
        id: collect
        run: |
          cd istoreos
          mkdir -p ../out
          IB=$(find bin/targets -type f \( -name '*.tar.zst' -o -name '*.tar.xz' \) \
                -path '*imagebuilder*' | sort | head -n1)
          if [ -z "$IB" ]; then
            echo "::error::未找到 ImageBuilder 压缩包，以下为 bin/targets 内容："
            find bin/targets -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "找到 IB：$IB"
          BASE=$(basename "$IB")
          # 统一命名，供工作流二直接引用
          cp "$IB" "../out/iStoreOS-imagebuilder-rockchip-armv8.Linux-x86_64.tar.zst"
          echo "file=../out/iStoreOS-imagebuilder-rockchip-armv8.Linux-x86_64.tar.zst" >> "$GITHUB_OUTPUT"
          echo "origin=$BASE" >> "$GITHUB_OUTPUT"
          # 同时保存构建环境指纹，便于复现与排查
          git log -1 --pretty=format:'%H' > ../out/SOURCE_REVISION.txt || true
          ls -lh ../out/

      - name: 写入构建摘要
        run: |
          {
            echo "## ImageBuilder 构建完成"
            echo ""
            echo "- 上游仓库：\`${{ inputs.source_repo }}\`"
            echo "- 源码分支：\`${{ inputs.source_branch }}\`"
            echo "- 注入设备：\`${{ inputs.add_devices }}\`"
            echo "- STANDALONE：\`${{ inputs.ib_standalone }}\`"
            echo "- 产物原名：\`${{ steps.collect.outputs.origin }}\`"
            echo ""
            echo "> 该 IB 已包含 panther-x2、g68-plus 设备，可直接用于「Build Firmware With ImageBuilder」工作流。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 IB 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-ImageBuilder-rockchip-armv8
          path: out/*
          compression-level: 0
          retention-days: 30

      - name: 发布到 Release（可选）
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ib-${{ github.run_number }}
          name: ImageBuilder rockchip-armv8 (build ${{ github.run_number }})
          files: out/*
          draft: false
          prerelease: true
