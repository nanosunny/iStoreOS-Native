name: Make iStoreOS ImageBuilder

# ============================================================================
# 工作流一：制作 ImageBuilder（IB）
#
# 关键前提（必读）：
#   panther-x2 / g68-plus 不是 iStoreOS 官方目标自带的设备。它们的 Device 定义、
#   DTS、无线与交换芯片补丁，全部由【本仓库】的 scripts/02_add_device.sh 注入
#   上游源码。ImageBuilder 是「源码编译后的产物」，只认编译时存在的 profile，
#   因此必须先把设备注入到上游源码，再在这份源码上编译并打包 IB。
#
#   ⚠️ 02_add_device.sh 不在上游 istoreos 仓库里，它在本仓库中。
#      上一版工作流 cd 进上游后在源码里 find 该脚本，必然报「未找到 02_add_device.sh」。
#      本版改为：以本仓库根目录为 $GITHUB_WORKSPACE，再用绝对路径执行本仓库脚本。
#
#   02_add_device.sh 内部依赖（均在本仓库，checkout 后即在 $GITHUB_WORKSPACE 下）：
#     scripts/02_add_device.sh
#     configfiles/dts/rk3568/rk3566-panther-x2.dts
#     configfiles/dts/rk3568/rk3568-nsy-g68-plus.dts
#     configfiles/nsy-g68-plus/{mt7916_eeprom.bin,990-mt76-add-mt7916-chipid.patch,
#                               999-rtl8365mb-dsa-leds.patch}
#
#   分支必须与实际补丁目录匹配：脚本按 target/linux/rockchip/Makefile 的
#   KERNEL_PATCHVER 决定 patches-<ver> 目录，本仓库适配的是 25.12（内核 6.12）。
#
# 产出：bin/targets/rockchip/armv8/*-imagebuilder-*.tar.zst
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'iStoreOS 上游源码仓库'
        required: true
        default: 'https://github.com/istoreos/istoreos.git'
        type: string
      source_branch:
        description: '上游源码分支（必须与设备补丁目录匹配）'
        required: true
        default: 'istoreos-25.12'
        type: choice
        options:
          - istoreos-25.12
          - istoreos-24.10
      add_devices:
        description: '是否注入 panther-x2 / g68-plus 设备与补丁'
        required: true
        default: true
        type: boolean
      ib_standalone:
        description: 'IB 是否自带全部软件包（STANDALONE）：独立可用但体积大、更慢'
        required: true
        default: false
        type: boolean
      build_threads:
        description: '编译线程数（0 = 自动取 CPU 核数一半）'
        required: true
        default: '0'
        type: string
      upload_release:
        description: '是否把 IB 发布到 Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: make-ib-${{ github.ref }}
  cancel-in-progress: false

env:
  # 本仓库脚本执行时使用的固定路径，避免 cd 后 $GITHUB_WORKSPACE 语义混淆
  DIY_P1_SH: scripts/01_get_ready.sh
  DIY_P2_SH: scripts/02_add_device.sh
  DIY_P3_SH: scripts/03_prepare_package.sh
  IB_BOARD: rockchip
  IB_SUBTARGET: armv8

jobs:
  make-ib:
    name: Build ImageBuilder (rockchip/armv8)
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: 检出本仓库（获取注入脚本与 configfiles）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: selfrepo

      - name: 自检本仓库必需文件
        run: |
          set -e
          BASE="$GITHUB_WORKSPACE/selfrepo"
          need=(
            "scripts/01_get_ready.sh"
            "scripts/02_add_device.sh"
            "scripts/03_prepare_package.sh"
            "configfiles/dts/rk3568/rk3566-panther-x2.dts"
            "configfiles/dts/rk3568/rk3568-nsy-g68-plus.dts"
            "configfiles/nsy-g68-plus/mt7916_eeprom.bin"
            "configfiles/nsy-g68-plus/990-mt76-add-mt7916-chipid.patch"
            "configfiles/nsy-g68-plus/999-rtl8365mb-dsa-leds.patch"
          )
          miss=0
          for f in "${need[@]}"; do
            if [ -e "$BASE/$f" ]; then
              echo "OK   $f"
            else
              echo "::error::缺少必需文件 $f"
              miss=1
            fi
          done
          [ "$miss" = "0" ] || exit 1

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 安装构建依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gettext git \
            gcc-multilib g++-multilib \
            libncurses5-dev libncursesw5-dev zlib1g-dev libssl-dev \
            python3 python3-setuptools python3-pip python3-ply python3-pyelftools \
            rsync unzip file wget curl time swig subversion patch \
            zstd gzip xz-utils ecj fastjar jq libelf-dev libgnutls28-dev libglib2.0-dev

      - name: 配置编译线程数
        id: threads
        run: |
          if [ "${{ inputs.build_threads }}" = "0" ] || [ -z "${{ inputs.build_threads }}" ]; then
            N=$(( $(nproc) / 2 )); [ "$N" -lt 2 ] && N=2
            echo "j=$N" >> "$GITHUB_OUTPUT"
          else
            echo "j=${{ inputs.build_threads }}" >> "$GITHUB_OUTPUT"
          fi
          echo "使用线程数：$(grep '^j=' $GITHUB_OUTPUT | cut -d= -f2)"

      - name: 克隆上游源码
        run: |
          set -e
          git clone --depth 1 \
            --branch "${{ inputs.source_branch }}" \
            "${{ inputs.source_repo }}" "$GITHUB_WORKSPACE/openwrt"
          cd "$GITHUB_WORKSPACE/openwrt"
          echo "上游源码版本：$(git log -1 --pretty=format:'%H %ad %s' --date=short)"

      - name: 加载自定义 feeds.conf（本仓库 armv8/feeds.conf）
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE/selfrepo/armv8/feeds.conf"
          if [ -f "$SRC" ]; then
            cp -f "$SRC" "$GITHUB_WORKSPACE/openwrt/feeds.conf"
            echo "已加载自定义 feeds.conf："
            cat "$GITHUB_WORKSPACE/openwrt/feeds.conf"
          else
            echo "::warning::本仓库未提供 armv8/feeds.conf，使用上游默认"
          fi

      - name: 更换为国内下载源（加速，仅镜像二进制 tarball，不镜像 feeds.git）
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"

          # 1) Git 提速：浅层 + 不检出 blobs，显著减小 feeds 克隆体积
          git config --global --add safe.directory '*' || true
          cat >> "$HOME/.gitconfig" <<'GITEOF'
[core]
  compression = 0
[fetch]
  parallelism = 0
GITEOF
          # GitHub Actions 的 runner 直连 GitHub 其实很快，所以 feeds 保持官方 URL 不替换，
          # 避免像上版那样指到清华不存在的路径导致 fatal。

          # 2) dl 下载源替换为清华 OpenWrt 二进制镜像（这才是清华真正有的东西）
          cat >> files/repositories.override <<'CONF' 2>/dev/null || true
# 二进制包源由 IB 内部 repositories.conf 控制，此处不做处理
CONF
          # 让 OpenWrt 构建系统优先从清华镜像下载 tarball（只影响 dl/，不影响 feeds）
          cat > .download-sed.sed <<'SEDEOF'
s#https://downloads.openwrt.org#https://mirrors.tuna.tsinghua.edu.cn/openwrt#g
s#https://downloads.istoreos.com#https://mirrors.tuna.tsinghua.edu.cn/istoreos#g
SEDEOF
          echo "下载源替换完成（仅二进制包，feeds 走 GitHub 直连）"
          cat feeds.conf 2>/dev/null || cat feeds.conf.default


      - name: 执行 P1（01_get_ready.sh：.vermagic / version）
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"
          export GITHUB_WORKSPACE="$GITHUB_WORKSPACE/selfrepo"
          chmod +x "$GITHUB_WORKSPACE/${{ env.DIY_P1_SH }}"
          bash "$GITHUB_WORKSPACE/${{ env.DIY_P1_SH }}"
          echo "--- .vermagic ---"; cat .vermagic
          echo "--- version ---";   cat version

      - name: 执行 P2（02_add_device.sh：注入设备与补丁）
        if: ${{ inputs.add_devices }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"
          # 脚本内以 $GITHUB_WORKSPACE/configfiles 取资源，这里把它指向本仓库根目录
          export GITHUB_WORKSPACE="$GITHUB_WORKSPACE/selfrepo"
          SCRIPT="$GITHUB_WORKSPACE/${{ env.DIY_P2_SH }}"
          echo "执行注入脚本：$SCRIPT"
          bash "$SCRIPT"

          echo "===== 注入结果自检 ====="
          fail=0
          for dev in panther_panther-x2 nsy_g68-plus; do
            if grep -q "define Device/${dev}\$" target/linux/rockchip/image/legacy.mk; then
              echo "OK   legacy.mk 已包含 Device/${dev}"
            else
              echo "::error::legacy.mk 未包含 Device/${dev}"
              fail=1
            fi
          done
          for dts in rk3566-panther-x2.dts rk3568-nsy-g68-plus.dts; do
            if [ -f "target/linux/rockchip/dts/rk3568/$dts" ]; then
              echo "OK   DTS 已就位：$dts"
            else
              echo "::error::DTS 缺失：$dts"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "::error::设备注入不完整，终止"; exit 1; }

      - name: 下载源缓存（dl 目录，命中后跳过重复下载）
        uses: actions/cache@v4
        with:
          path: |
            ~/openwrt-dl
          key: dl-istoreos-${{ inputs.source_branch }}-${{ hashFiles('selfrepo/armv8/feeds.conf', 'selfrepo/scripts/03_prepare_package.sh') }}
          restore-keys: |
            dl-istoreos-${{ inputs.source_branch }}-

      - name: 更新并安装 feeds
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"

          # 统一把 dl 指到持久目录，命中缓存可直接复用
          mkdir -p "$HOME/openwrt-dl"
          mkdir -p dl
          mountpoint dl >/dev/null 2>&1 || {
            rm -rf dl && ln -s "$HOME/openwrt-dl" dl
          }

          # 二进制 tarball 下载源 → 清华（真正可用的镜像）
          export DOWNLOAD_MIRROR="https://mirrors.tuna.tsinghua.edu.cn/openwrt"
          export DL_MIRROR="https://mirrors.tuna.tsinghua.edu.cn/openwrt"
          export ISTOREOS_DL_MIRROR="https://mirrors.tuna.tsinghua.edu.cn/istoreos"

          # feeds update：失败自动重试 3 次，GitHub 偶发 clone 失败可自愈
          update_feeds() {
            for i in 1 2 3; do
              echo "===== feeds update 第 $i 次尝试 ====="
              if ./scripts/feeds update -a; then
                return 0
              fi
              echo "feeds update 失败，10s 后重试 ($i/3)"
              sleep 10
            done
            return 1
          }
          update_feeds

          # 与官方流程一致：用本仓库的 node-pnpm 覆盖 feeds/packages 中的版本
          if [ -d "$GITHUB_WORKSPACE/selfrepo/configfiles/node-pnpm" ]; then
            mkdir -p feeds/packages/lang/
            cp -a "$GITHUB_WORKSPACE/selfrepo/configfiles/node-pnpm" feeds/packages/lang/
          fi

          # 更新 packages 源的 index
          ./scripts/feeds update packages

          # 安装 feeds 到 package/ 下，失败也重试一次
          if ! ./scripts/feeds install -a; then
            echo "::warning::feeds install -a 第一次失败，再试一次"
            ./scripts/feeds install -a
          fi

      - name: 执行 P3（03_prepare_package.sh：ttyd/samba/rust/OAF）
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"
          export GITHUB_WORKSPACE="$GITHUB_WORKSPACE/selfrepo"
          chmod +x "$GITHUB_WORKSPACE/${{ env.DIY_P3_SH }}"
          bash "$GITHUB_WORKSPACE/${{ env.DIY_P3_SH }}" || {
            echo "::warning::P3 部分步骤失败，继续尝试编译"; }

      - name: 生成 IB 编译配置
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"
          BOARD="${{ env.IB_BOARD }}"
          SUB="${{ env.IB_SUBTARGET }}"
          WANT_DEV="${{ inputs.add_devices }}"

          # 以「只编 rockchip/armv8 + 允许两个自定义设备 + 打开 IB」为原则生成配置。
          # 关键：不打开 TARGET_ALL_PROFILES，避免把官方全部设备都编进去（慢、产物大）。
          : > .config
          echo "CONFIG_TARGET_${BOARD}=y"              >> .config
          echo "CONFIG_TARGET_${BOARD}_${SUB}=y"       >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y"         >> .config
          echo "# CONFIG_TARGET_ALL_PROFILES is not set" >> .config
          echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y"     >> .config

          if [ "$WANT_DEV" = "true" ]; then
            echo "CONFIG_TARGET_DEVICE_${BOARD}_${SUB}_DEVICE_panther_panther-x2=y" >> .config
            echo "CONFIG_TARGET_DEVICE_${BOARD}_${SUB}_DEVICE_nsy_g68-plus=y"       >> .config
          fi

          echo "CONFIG_IB=y" >> .config
          if [ "${{ inputs.ib_standalone }}" = "true" ]; then
            echo "CONFIG_IB_STANDALONE=y" >> .config
          else
            echo "# CONFIG_IB_STANDALONE is not set" >> .config
          fi
          echo "# CONFIG_ALL_KMODS is not set" >> .config
          echo "# CONFIG_ALL is not set"       >> .config

          make defconfig
          echo "===== 生效的关键配置 ====="
          grep -E '^CONFIG_(TARGET_'"${BOARD}"'|TARGET_MULTI_PROFILE|TARGET_PER_DEVICE_ROOTFS|IB|IB_STANDALONE)' .config || true
          echo "--- IB 开关必须为 y ---"
          grep -q '^CONFIG_IB=y' .config || { echo "::error::CONFIG_IB 未生效"; exit 1; }

      - name: 下载源码包（并发，失败补漏）
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"
          # 将下载 URL 指到清华镜像，加速 tarball 拉取（仅影响 dl/ 下载，不影响 feeds）
          find . -maxdepth 3 \( -name '*.mk' -o -name 'Makefile' \) -print0 2>/dev/null \
            | xargs -0 sed -i 's#https://downloads.openwrt.org/sources#https://mirrors.tuna.tsinghua.edu.cn/openwrt/sources#g' 2>/dev/null || true

          make download -j8 || true
          # 单线程补漏，个别未下全的包在此修复（失败不致命）
          make download -j1 V=s || true

      - name: 编译工具链与目标（含注入设备的内核）
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"
          J=${{ steps.threads.outputs.j }}
          echo "并行度 J=$J"
          if ! make tools/install toolchain/install target/linux/install -j"$J"; then
            echo "::warning::并行编译失败，回退单线程以暴露真实错误"
            make tools/install toolchain/install target/linux/install -j1 V=s
          fi

      - name: 打包 ImageBuilder
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"
          make target/imagebuilder/compile -j1 V=s 2>&1 | tee /tmp/ib-build.log
          echo "===== bin/targets 下的 IB 相关产物 ====="
          find bin/targets -iname '*imagebuilder*' | sort || true

      - name: 收集并规整 IB 产物
        id: collect
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"
          DEST="$GITHUB_WORKSPACE/out"
          mkdir -p "$DEST"
          # 兼容 .tar.zst（25.12）与 .tar.xz（老版本）
          IB=$(find bin/targets -type f \
                 \( -name '*-imagebuilder-*.tar.zst' -o -name '*-imagebuilder-*.tar.xz' \) \
               | sort | head -n1)
          if [ -z "$IB" ]; then
            echo "::error::未找到 ImageBuilder 压缩包，以下为 bin/targets 内容："
            find bin/targets -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "原生产物：$IB"
          cp -f "$IB" "$DEST/iStoreOS-imagebuilder-rockchip-armv8.Linux-x86_64.tar.zst"
          echo "file=$DEST/iStoreOS-imagebuilder-rockchip-armv8.Linux-x86_64.tar.zst" >> "$GITHUB_OUTPUT"
          echo "origin=$(basename "$IB")" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=format:'%H' > "$DEST/SOURCE_REVISION.txt" || true
          ls -lh "$DEST"

      - name: 写入构建摘要
        if: always()
        run: |
          {
            echo "## ImageBuilder 构建结果"
            echo ""
            echo "- 上游仓库：\`${{ inputs.source_repo }}\`"
            echo "- 源码分支：\`${{ inputs.source_branch }}\`"
            echo "- 注入设备：\`${{ inputs.add_devices }}\`"
            echo "- STANDALONE：\`${{ inputs.ib_standalone }}\`"
            echo "- 产物原名：\`${{ steps.collect.outputs.origin }}\`"
            echo ""
            echo "> 该 IB 已包含 panther_panther-x2、nsy_g68-plus，可直接用于「Build Firmware With ImageBuilder」。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 IB 为 Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-ImageBuilder-rockchip-armv8
          path: out/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: 发布到 Release（可选）
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ib-${{ github.run_number }}
          name: ImageBuilder rockchip-armv8 (build ${{ github.run_number }})
          files: out/*
          draft: false
          prerelease: true
