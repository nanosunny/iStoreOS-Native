name: Make iStoreOS ImageBuilder

# 制作带 panther-x2 / nsy-g68-plus 设备 + iStoreOS 插件源的 ImageBuilder
# 基于 OpenWrt 最新稳定版官方 IB 二次注入与封装，最终产物发布到 Release
on:
  workflow_dispatch:
    inputs:
      openwrt_ver:
        description: OpenWrt 版本（25.12 为最新稳定版）
        required: true
        default: "25.12.6"
        type: choice
        options:
          - "25.12.6"
          - "25.12.5"
      istoreos_ver:
        description: 对应 iStoreOS 插件源版本（apk 源基线）
        required: true
        default: "25.12"
        type: choice
        options:
          - "25.12"
      target_board:
        description: 目标架构
        required: true
        default: rockchip
        type: choice
        options:
          - rockchip
      target_subtarget:
        description: 子架构
        required: true
        default: armv8
        type: choice
        options:
          - armv8
      download_mirror:
        description: OpenWrt IB 下载镜像
        required: true
        default: tuna
        type: choice
        options:
          - tuna
          - official
      add_devices:
        description: 是否注入 panther-x2 / nsy-g68-plus 设备
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      try_patched_kmod:
        description: 是否尝试用 iStoreOS kmod 替换官方 kmod
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      release_tag:
        description: Release 标签（留空则只上 Artifact）
        required: false
        default: "imagebuilder-latest"
        type: string

permissions:
  contents: write

jobs:
  make-ib:
    name: Build Custom ImageBuilder
    runs-on: ubuntu-latest
    steps:
      - name: 准备工作目录
        run: |
          sudo mkdir -p /work
          sudo chown -R $USER:$USER /work
          mkdir -p /work/ib /work/build /work/scripts

      - name: Checkout 本仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: selfrepo

      - name: 检查注入所需文件完整性
        if: ${{ github.event.inputs.add_devices == 'true' }}
        working-directory: selfrepo
        run: |
          echo "=== 核对设备注入必需文件 ==="
          for f in \
            configfiles/dts/rk3568/rk3566-panther-x2.dts \
            configfiles/dts/rk3568/rk3568-nsy-g68-plus.dts \
            configfiles/nsy-g68-plus/mt7916_eeprom.bin \
            configfiles/nsy-g68-plus/990-mt76-add-mt7916-chipid.patch \
            configfiles/nsy-g68-plus/999-rtl8365mb-dsa-leds.patch ; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少必需文件：$f"
              exit 1
            fi
            echo "  OK: $f"
          done

      - name: 放置辅助脚本（base64 解码写入，避免 YAML 缩进问题）
        run: |
          echo "$B64_APPEND_DEVICES" | base64 -d > /work/scripts/append_devices.py
          echo "$B64_INJECT_NET"    | base64 -d > /work/scripts/inject_network.py
          echo "$B64_WRITE_REPOS"   | base64 -d > /work/scripts/write_repos.py
          echo "$B64_DL_KMOD"       | base64 -d > /work/scripts/dl_kmod.sh
          chmod +x /work/scripts/*.py /work/scripts/*.sh
          ls -l /work/scripts/
        env:
          B64_APPEND_DEVICES: 
          B64_INJECT_NET: 
          B64_WRITE_REPOS: 
          B64_DL_KMOD: 

      - name: 下载 OpenWrt 官方 ImageBuilder
        working-directory: /work/build
        run: |
          set -e
          VER="${{ github.event.inputs.openwrt_ver }}"
          BOARD="${{ github.event.inputs.target_board }}"
          SUB="${{ github.event.inputs.target_subtarget }}"
          IB_NAME="openwrt-imagebuilder-${VER}-${BOARD}-${SUB}.Linux-x86_64.tar.zst"
          if [ "${{ github.event.inputs.download_mirror }}" = "tuna" ]; then
            IB_URL="https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/${VER}/targets/${BOARD}/${SUB}/${IB_NAME}"
          else
            IB_URL="https://downloads.openwrt.org/releases/${VER}/targets/${BOARD}/${SUB}/${IB_NAME}"
          fi
          echo "下载地址：$IB_URL"
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试 ==="
            if curl -fL --connect-timeout 20 --max-time 240 --retry 3 -o "$IB_NAME" "$IB_URL"; then
              echo "下载成功"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "::error::IB 下载失败"
              exit 1
            fi
            sleep 5
          done
          ls -lh "$IB_NAME"

      - name: 解压 ImageBuilder
        working-directory: /work/build
        run: |
          set -e
          VER="${{ github.event.inputs.openwrt_ver }}"
          BOARD="${{ github.event.inputs.target_board }}"
          SUB="${{ github.event.inputs.target_subtarget }}"
          IB_NAME="openwrt-imagebuilder-${VER}-${BOARD}-${SUB}.Linux-x86_64.tar.zst"
          tar -xf "$IB_NAME" -C /work/ib --strip-components=1
          rm -f "$IB_NAME"
          ls /work/ib/

      - name: 注入 DTS 与 legacy.mk 设备定义
        if: ${{ github.event.inputs.add_devices == 'true' }}
        run: |
          set -e
          IB=/work/ib
          SR="$GITHUB_WORKSPACE/selfrepo"
          DTS_DIR="$IB/target/linux/rockchip/dts/rk3568"
          LEGACY_MK="$IB/target/linux/rockchip/image/legacy.mk"
          mkdir -p "$DTS_DIR"
          test -f "$LEGACY_MK" || { echo "::error::$LEGACY_MK 不存在"; exit 1; }
          cp -f "$SR/configfiles/dts/rk3568/rk3566-panther-x2.dts" "$DTS_DIR/"
          cp -f "$SR/configfiles/dts/rk3568/rk3568-nsy-g68-plus.dts" "$DTS_DIR/"
          python3 /work/scripts/append_devices.py "$LEGACY_MK"
          tail -25 "$LEGACY_MK"

      - name: 注入 02_network 网口映射
        if: ${{ github.event.inputs.add_devices == 'true' }}
        run: |
          set -e
          IB=/work/ib
          NET="$IB/target/linux/rockchip/armv8/base-files/etc/board.d/02_network"
          test -f "$NET" || { echo "::error::02_network 不存在：$NET"; exit 1; }
          python3 /work/scripts/inject_network.py "$NET"
          grep -B1 -A3 'nsy,g68-plus' "$NET"

      - name: 注入 mt7916 eeprom 固件
        if: ${{ github.event.inputs.add_devices == 'true' }}
        run: |
          set -e
          mkdir -p /work/ib/files/lib/firmware/mediatek
          cp -f "$GITHUB_WORKSPACE/selfrepo/configfiles/nsy-g68-plus/mt7916_eeprom.bin" /work/ib/files/lib/firmware/mediatek/
          ls -l /work/ib/files/lib/firmware/mediatek/

      - name: 尝试拉取 iStoreOS 同版 kmod（mt76 / rtl8365mb）
        if: ${{ github.event.inputs.add_devices == 'true' && github.event.inputs.try_patched_kmod == 'true' }}
        run: |
          /work/scripts/dl_kmod.sh /work/ib "${{ github.event.inputs.istoreos_ver }}"

      - name: 替换 repositories.conf 为 iStoreOS 官方 apk 源
        run: |
          set -e
          cp /work/ib/repositories.conf /work/ib/repositories.conf.openwrt.bak
          python3 /work/scripts/write_repos.py \
            /work/ib/repositories.conf \
            "${{ github.event.inputs.istoreos_ver }}" \
            "aarch64_generic"
          echo "=== 新 repositories.conf ==="
          cat /work/ib/repositories.conf

      - name: 预置 iStore 核心应用
        run: |
          set -e
          TD=/work/ib/include/target-defaults.mk
          if [ -f "$TD" ]; then
            if ! grep -q 'luci-app-store' "$TD"; then
              sed -i '/^DEFAULT_PACKAGES[[:space:]]*+=/ s/$/ luci-app-store luci-i18n-store-zh-cn luci-compat/' "$TD"
            fi
          fi
          echo "DEFAULT_PACKAGES 预置完成"
          grep 'DEFAULT_PACKAGES' "$TD" | head -3 || true

      - name: 清理缓存并自检 profile
        if: ${{ github.event.inputs.add_devices == 'true' }}
        working-directory: /work/ib
        run: |
          rm -rf tmp 2>/dev/null || true
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential gawk unzip libncurses-dev zlib1g-dev python3 file wget \
            xsltproc git ca-certificates python3-pyelftools >/dev/null 2>&1 || true
          echo "=== make info 探测两设备 ==="
          make info 2>&1 | grep -E "panther-panther-x2|nsy-g68-plus" || \
            echo "::warning::make info 未显示两设备（DTS 模板依赖可能需 make 阶段解析，不阻断打包）"

      - name: 重新打包 ImageBuilder
        working-directory: /work
        run: |
          set -e
          VER="${{ github.event.inputs.openwrt_ver }}"
          IVER="${{ github.event.inputs.istoreos_ver }}"
          STAMP="$(date +%Y%m%d%H%M)"
          OUT_NAME="istoreos-imagebuilder-${IVER}-pantherx2-g68plus-${STAMP}.Linux-x86_64"
          mv ib "$OUT_NAME"
          tar --zstd -cf "${OUT_NAME}.tar.zst" "$OUT_NAME"
          sha256sum "${OUT_NAME}.tar.zst" > "${OUT_NAME}.tar.zst.sha256"
          cat "${OUT_NAME}.tar.zst.sha256"
          mkdir -p /work/out
          mv "${OUT_NAME}.tar.zst" "${OUT_NAME}.tar.zst.sha256" /work/out/
          ls -lh /work/out/

      - name: 上传 ImageBuilder 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-ImageBuilder-${{ github.event.inputs.target_board }}-${{ github.event.inputs.target_subtarget }}
          path: /work/out/*
          retention-days: 30
          compression-level: 0

      - name: 发布到 Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "iStoreOS ImageBuilder - panther-x2 / G68-PLUS"
          prerelease: false
          files: /work/out/*
          body: |
            ## iStoreOS ImageBuilder（基于 OpenWrt ${{ github.event.inputs.openwrt_ver }}）
            - 目标平台：rockchip / armv8
            - 集成设备：panther-panther-x2、nsy-g68-plus
            - 插件源：iStoreOS 官方 apk 源（dl.istoreos.com）
            - 内置 iStore 应用商店
