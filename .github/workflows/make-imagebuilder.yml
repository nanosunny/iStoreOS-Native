name: Make iStoreOS ImageBuilder

# ============================================================================
# 工作流一：制作 ImageBuilder（IB）
#
# 设计口径（本版核心）：
#   1) 插件源、feeds、软件包全部使用【官方默认】：
#      - feeds 用本仓库自带的 armv8/feeds.conf（其首行 src-include defaults
#        feeds.conf.default，即官方 feeds）。
#      - 软件包/插件清单用本仓库自带的 armv8/.config（官方预置配置）。
#      - 全程不替换任何镜像源（不改 dl、不改 feeds、不建 repositories.override）。
#   2) 只做三处最小定制，其余保持官方原样：
#      - 打开 CONFIG_IB=y（官方 .config 里默认是关闭的）。
#      - 关闭 CONFIG_TARGET_ALL_PROFILES，把编译范围收敛到两个设备（减体积）。
#      - 打开 panther-x2 / g68-plus 两个 Device，移除其余设备。
#   3) 设备注入仍走本仓库的 scripts/02_add_device.sh（官方流程 P1→P2→P3）。
#
# 关键前提：
#   panther-x2 / g68-plus 不是 iStoreOS 官方目标自带设备，其 Device 定义、DTS、
#   无线与交换芯片补丁由本仓库 scripts/02_add_device.sh 注入上游源码。IB 只认
#   编译时存在的 profile，因此必须先注入再基于同一份源码编译出 IB。
#
# 目录约定（与官方 build-istoreos-6.x.yml 一致）：
#   actions/checkout 到 $GITHUB_WORKSPACE，上游源码 clone 到 $GITHUB_WORKSPACE/openwrt。
#   于是本仓库脚本内部的 $GITHUB_WORKSPACE/configfiles 天然指向本仓库，无需再修正。
#
# 产出：bin/targets/rockchip/armv8/*-imagebuilder-*.tar.zst
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'iStoreOS 上游源码仓库'
        required: true
        default: 'https://github.com/istoreos/istoreos.git'
        type: string
      source_branch:
        description: '上游源码分支（必须与设备补丁目录 patches-<内核版本> 匹配）'
        required: true
        default: 'istoreos-25.12'
        type: choice
        options:
          - istoreos-25.12
          - istoreos-24.10
      add_devices:
        description: '注入 panther-x2 / g68-plus 设备与补丁'
        required: true
        default: true
        type: boolean
      ib_standalone:
        description: 'IB 自带全部 ipk（true=离线可用但体积大、更慢；false=更小更快）'
        required: true
        default: false
        type: boolean
      upload_release:
        description: '是否把 IB 发布到 Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: make-ib-${{ github.ref }}
  cancel-in-progress: false

env:
  DIY_P1_SH: scripts/01_get_ready.sh
  DIY_P2_SH: scripts/02_add_device.sh
  DIY_P3_SH: scripts/03_prepare_package.sh
  BOARD: rockchip
  SUBTARGET: armv8

jobs:
  make-ib:
    name: Build ImageBuilder (rockchip/armv8)
    runs-on: ubuntu-24.04
    timeout-minutes: 600

    steps:
      - name: 检出本仓库（官方脚本与配置都从这里取）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 自检本仓库必需文件
        run: |
          set -e
          need=(
            "armv8/.config"
            "armv8/feeds.conf"
            "scripts/01_get_ready.sh"
            "scripts/02_add_device.sh"
            "scripts/03_prepare_package.sh"
            "configfiles/dts/rk3568/rk3566-panther-x2.dts"
            "configfiles/dts/rk3568/rk3568-nsy-g68-plus.dts"
            "configfiles/nsy-g68-plus/mt7916_eeprom.bin"
            "configfiles/nsy-g68-plus/990-mt76-add-mt7916-chipid.patch"
            "configfiles/nsy-g68-plus/999-rtl8365mb-dsa-leds.patch"
          )
          miss=0
          for f in "${need[@]}"; do
            if [ -e "$f" ]; then
              echo "OK   $f"
            else
              echo "::error::缺少必需文件 $f"
              miss=1
            fi
          done
          [ "$miss" = "0" ] || exit 1

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 安装构建依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison cmake g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libgnutls28-dev libfuse-dev libncurses-dev libssl-dev \
            python3 python3-pip python3-setuptools python3-ply python3-pyelftools \
            rsync unzip zlib1g-dev file wget subversion patch upx-ucl \
            autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 \
            uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev \
            libtool autopoint antlr3 gperf ccache swig coreutils haveged scons \
            libpython3-dev rename qemu-utils jq zstd gzip xz-utils
          sudo apt-get install -y npm || true
          sudo -E npm install -g pnpm 2>/dev/null || true
          sudo -E npm install -g n 2>/dev/null || true
          sudo -E n stable 2>/dev/null || true
          sudo apt-get clean

      - name: 克隆上游源码
        run: |
          set -e
          git clone --depth 1 \
            --branch "${{ inputs.source_branch }}" \
            "${{ inputs.source_repo }}" "$GITHUB_WORKSPACE/openwrt"
          cd "$GITHUB_WORKSPACE/openwrt"
          echo "上游版本：$(git log -1 --pretty=format:'%H %ad %s' --date=short)"
          echo "KERNEL_PATCHVER=$(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/rockchip/Makefile)"

      - name: 缓存编译产物（ccache，加速二次构建）
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          mixkey: ${{ runner.os }}-${{ env.SUBTARGET }}-${{ inputs.source_branch }}
          prefix: ${{ github.workspace }}/openwrt

      - name: 加载本仓库 feeds.conf（官方默认插件源，不做任何镜像替换）
        run: |
          set -e
          cp -f "$GITHUB_WORKSPACE/armv8/feeds.conf" "$GITHUB_WORKSPACE/openwrt/feeds.conf"
          echo "===== 生效的 feeds.conf ====="
          cat "$GITHUB_WORKSPACE/openwrt/feeds.conf"
          echo "===== 上游默认 feeds.conf.default ====="
          cat "$GITHUB_WORKSPACE/openwrt/feeds.conf.default"

      - name: 执行 P1（01_get_ready.sh：.vermagic / version）
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e
          chmod +x "$GITHUB_WORKSPACE/${{ env.DIY_P1_SH }}"
          bash "$GITHUB_WORKSPACE/${{ env.DIY_P1_SH }}"
          echo "--- .vermagic ---"; cat .vermagic
          echo "--- version ---";   cat version

      - name: 更新并安装 feeds（官方源，失败自动重试）
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then echo "::error::重试 3 次仍失败：$*"; return 1; fi
              echo ">> 失败，5s 后重试（$n/3）：$*"; n=$((n+1)); sleep 5
            done
          }
          retry ./scripts/feeds update -a
          mkdir -p feeds/packages/lang
          cp -a "$GITHUB_WORKSPACE/configfiles/node-pnpm" feeds/packages/lang/
          retry ./scripts/feeds update packages
          retry ./scripts/feeds install -a
          echo "feeds 更新并安装完成"

      - name: 执行 P2（02_add_device.sh：注入两个设备）
        if: ${{ inputs.add_devices }}
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e
          chmod +x "$GITHUB_WORKSPACE/${{ env.DIY_P2_SH }}"
          bash "$GITHUB_WORKSPACE/${{ env.DIY_P2_SH }}"
          echo "===== 设备注入自检 ====="
          fail=0
          for dev in panther_panther-x2 nsy_g68-plus; do
            if grep -q "^define Device/${dev}\$" target/linux/rockchip/image/legacy.mk; then
              echo "OK   legacy.mk 含 Device/${dev}"
            else
              echo "::error::legacy.mk 缺 Device/${dev}"; fail=1
            fi
          done
          for dts in rk3566-panther-x2.dts rk3568-nsy-g68-plus.dts; do
            if [ -f "target/linux/rockchip/dts/rk3568/$dts" ]; then
              echo "OK   DTS $dts"
            else
              echo "::error::缺 DTS $dts"; fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "::error::设备注入不完整，终止"; exit 1; }

      - name: 执行 P3（03_prepare_package.sh）
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e
          chmod +x "$GITHUB_WORKSPACE/${{ env.DIY_P3_SH }}"
          bash "$GITHUB_WORKSPACE/${{ env.DIY_P3_SH }}"
          echo "P3 完成"

      - name: 加载官方 .config 并做最小定制（打开 IB、收敛到两个设备）
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e
          # 直接用本仓库自带的官方预置配置，插件/软件包清单完全按官方
          cp -f "$GITHUB_WORKSPACE/armv8/.config" .config
          CFG=.config

          # 1) 设备：只保留 panther-x2 / g68-plus，其余全部移除（减体积）
          grep -vE '^#? *CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_' "$CFG" > "$CFG.tmp"
          mv "$CFG.tmp" "$CFG"
          echo 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_panther_panther-x2=y' >> "$CFG"
          echo 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_nsy_g68-plus=y'       >> "$CFG"

          # 2) 不再编译全部 profile
          sed -i 's/^CONFIG_TARGET_ALL_PROFILES=y/# CONFIG_TARGET_ALL_PROFILES is not set/' "$CFG"
          grep -q '^CONFIG_TARGET_MULTI_PROFILE=y' "$CFG" \
            || sed -i 's/^# CONFIG_TARGET_MULTI_PROFILE is not set/CONFIG_TARGET_MULTI_PROFILE=y/' "$CFG"
          grep -q '^CONFIG_TARGET_MULTI_PROFILE=y' "$CFG" \
            || echo 'CONFIG_TARGET_MULTI_PROFILE=y' >> "$CFG"

          # 3) 打开 ImageBuilder
          sed -i 's/^# CONFIG_IB is not set/CONFIG_IB=y/' "$CFG"
          grep -q '^CONFIG_IB=y' "$CFG" || echo 'CONFIG_IB=y' >> "$CFG"

          # 4) STANDALONE 开关
          if [ "${{ inputs.ib_standalone }}" = "true" ]; then
            sed -i 's/^# CONFIG_IB_STANDALONE is not set/CONFIG_IB_STANDALONE=y/' "$CFG"
            grep -q '^CONFIG_IB_STANDALONE=y' "$CFG" || echo 'CONFIG_IB_STANDALONE=y' >> "$CFG"
          else
            sed -i 's/^CONFIG_IB_STANDALONE=y/# CONFIG_IB_STANDALONE is not set/' "$CFG"
          fi

          echo "===== 关键配置 ====="
          grep -nE 'CONFIG_IB|CONFIG_TARGET_ALL_PROFILES|CONFIG_TARGET_MULTI_PROFILE|DEVICE_panther|DEVICE_nsy|CONFIG_ALL_KMODS|CONFIG_CCACHE' "$CFG" || true

      - name: 生成配置（make defconfig）
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e
          make defconfig
          grep -q '^CONFIG_IB=y' .config || { echo "::error::CONFIG_IB 未生效"; exit 1; }
          echo "--- 目标设备 ---"
          grep 'DEVICE_panther\|DEVICE_nsy' .config || true
          echo "--- 选中设备数（应为 2）---"
          grep -c '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y' .config || true

      - name: 下载软件包（官方源，并发，失败补漏）
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e
          make download -j8 || true
          make download -j1 V=s || true

      - name: 编译工具链与目标
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e
          J=$(nproc)
          echo "并行度 -j$J"
          if ! make tools/install toolchain/install target/linux/install -j"$J"; then
            echo "::warning::并行编译失败，回退单线程以暴露真实错误"
            make tools/install toolchain/install target/linux/install -j1 V=s
          fi

      - name: 打包 ImageBuilder
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e
          make target/imagebuilder/compile -j1 V=s 2>&1 | tee /tmp/ib-build.log
          echo "===== bin/targets 下 IB 相关产物 ====="
          find bin/targets -iname '*imagebuilder*' | sort || true

      - name: 收集并规整 IB 产物
        id: collect
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"
          DEST="$GITHUB_WORKSPACE/out"
          mkdir -p "$DEST"
          # 兼容 .tar.zst（25.12）与 .tar.xz（老版本）
          IB=$(find bin/targets -type f \
                 \( -name '*-imagebuilder-*.tar.zst' -o -name '*-imagebuilder-*.tar.xz' \) \
               | sort | head -n1)
          if [ -z "$IB" ]; then
            echo "::error::未找到 ImageBuilder 压缩包，以下为 bin/targets 内容："
            find bin/targets -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "原生产物：$IB"
          cp -f "$IB" "$DEST/iStoreOS-imagebuilder-rockchip-armv8.Linux-x86_64.tar.zst"
          echo "file=$DEST/iStoreOS-imagebuilder-rockchip-armv8.Linux-x86_64.tar.zst" >> "$GITHUB_OUTPUT"
          echo "origin=$(basename "$IB")" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=format:'%H' > "$DEST/SOURCE_REVISION.txt" || true
          ls -lh "$DEST"

      - name: 写入构建摘要
        if: always()
        run: |
          {
            echo "## ImageBuilder 构建结果"
            echo ""
            echo "- 上游仓库：\`${{ inputs.source_repo }}\`"
            echo "- 源码分支：\`${{ inputs.source_branch }}\`"
            echo "- 注入设备：\`${{ inputs.add_devices }}\`"
            echo "- STANDALONE：\`${{ inputs.ib_standalone }}\`"
            echo "- 插件/软件包：官方默认（armv8/.config）"
            echo "- 源站：全部官方（未替换任何镜像）"
            echo "- 产物原名：\`${{ steps.collect.outputs.origin }}\`"
            echo ""
            echo "> 该 IB 已包含 panther_panther-x2、nsy_g68-plus，可直接用于「Build Firmware With ImageBuilder」。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 IB 为 Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-ImageBuilder-rockchip-armv8
          path: out/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: 发布到 Release（可选）
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ib-${{ github.run_number }}
          name: ImageBuilder rockchip-armv8 (build ${{ github.run_number }})
          files: out/*
          draft: false
          prerelease: true
